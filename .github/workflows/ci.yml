name: Verify app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: ["npm run typecheck", "npm run lint", "npm test -- --run"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run independent static check
        run: ${{ matrix.command }}

  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify generated static bundle
        run: npm run verify:static

  verify-browser:
    # Keep the runner OS within the pinned Playwright version's support matrix.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

  verify:
    if: ${{ always() }}
    needs: [verify-static, verify-build, verify-browser]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every verification lane
        env:
          STATIC_RESULT: ${{ needs.verify-static.result }}
          BUILD_RESULT: ${{ needs.verify-build.result }}
          BROWSER_RESULT: ${{ needs.verify-browser.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success
